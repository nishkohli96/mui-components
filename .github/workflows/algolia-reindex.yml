# Fires when Vercel posts a commit-status check for this commit — not on
# push — so the crawler always runs *after* the new build is live, never
# racing it. A plain `push: [main]` trigger fires the moment code lands, in
# parallel with Vercel's own build, so the crawler could scrape the
# still-old production site.
#
# NOTE: Vercel's GitHub integration reports build results via the Commit
# Status API (`on: status`). Only the production deployment of the current
# head of `main` triggers the crawler; see the `guard` job.
#
# Get ALGOLIA_CRAWLER_USERID & ALGOLIA_CRAWLER_API_KEY from
# https://crawler.algolia.com/admin/user/settings/
#
# ALGOLIA_APP_ID & ALGOLIA_CRAWLER_ID is obtained from
# the crawler settings page

name: Algolia reindex
on:
  status

permissions:
  contents: read

concurrency:
  group: algolia-reindex-${{ github.event.sha }}
  cancel-in-progress: true

jobs:
  # `github.event.branches` (the branches that contain the status commit) is
  # capped at 10 and also lists any branch that happens to contain the commit,
  # so it is not a reliable "is this main?" check. Compare the status commit to
  # the current head of main instead: only the production deployment of main
  # passes. A preview deployment of a PR branch, or of a commit main has since
  # moved past, is skipped (the newer main deployment triggers its own run).
  guard:
    if: >
      github.event.state == 'success' &&
      contains(github.event.context, 'Vercel') &&
      !contains(github.event.context, 'Preview Comments')
    runs-on: ubuntu-latest
    outputs:
      is_main_head: ${{ steps.check.outputs.is_main_head }}
    steps:
      - name: Check the commit is the head of main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.sha }}
          REPO: ${{ github.repository }}
        run: |
          main_sha=$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)
          if [ "$main_sha" = "$STATUS_SHA" ]; then
            echo "is_main_head=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main_head=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: ${STATUS_SHA} is not the head of main (${main_sha})."
          fi

  reindex:
    needs: guard
    if: needs.guard.outputs.is_main_head == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Wait 5 mins for prod CDN propagation
        run: sleep $((5*60))

      - name: Trigger Algolia Crawler (dev)
        env:
          CRAWLER_USERID: ${{ secrets.ALGOLIA_CRAWLER_USERID}}
          CRAWLER_API_KEY: ${{ secrets.ALGOLIA_CRAWLER_API_KEY }}
          CRAWLER_ID_DEV: ${{ secrets.ALGOLIA_CRAWLER_ID_DEV }}
        # -f makes curl exit nonzero on 4xx/5xx, so the
        # step (and workflow) now fails properly on auth/reindex errors.
        # Creds passed via -K (config read from stdin), not -u on the command
        # line — an argv value is visible to any process on the runner via
        # `ps`/`/proc/<pid>/cmdline` for the process's lifetime; stdin isn't.
        run: |
          curl -f -X POST -K - \
            "https://crawler.algolia.com/api/1/crawlers/${CRAWLER_ID_DEV}/reindex" \
            <<< "user = \"${CRAWLER_USERID}:${CRAWLER_API_KEY}\""

      - name: Trigger Algolia Crawler (production)
        env:
          CRAWLER_USERID: ${{ secrets.ALGOLIA_CRAWLER_USERID }}
          CRAWLER_API_KEY: ${{ secrets.ALGOLIA_CRAWLER_API_KEY }}
          CRAWLER_ID: ${{ secrets.ALGOLIA_CRAWLER_ID }}
        run: |
          curl -f -X POST -K - \
            "https://crawler.algolia.com/api/1/crawlers/${CRAWLER_ID}/reindex" \
            <<< "user = \"${CRAWLER_USERID}:${CRAWLER_API_KEY}\""
