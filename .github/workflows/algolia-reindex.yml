name: Algolia reindex
on:
  push:
    branches: [main]

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Algolia Crawler
        run: |
          curl -X POST \
            -u "${{ secrets.ALGOLIA_APP_ID }}:${{ secrets.ALGOLIA_API_KEY }}" \
            "https://crawler.algolia.com/api/1/crawlers/${{ secrets.ALGOLIA_CRAWLER_ID }}/reindex"
